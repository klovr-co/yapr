<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 400px; height: 250px; overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', 'Noto Sans', sans-serif;
    --primary: #FFB5E8;
    --secondary: #B5D8FF;
    --accent: #BFFCC6;
    --bg: #FFF5BA;
  }
  
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(3deg); }
  75% { transform: translateY(10px) rotate(-2deg); }
}
@keyframes pop-in {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  80% { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
@keyframes slow-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

  
</style>
</head>
<body>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;animation:pop-in .5s cubic-bezier(.68,-.55,.265,1.55) forwards;">
  <img src="assets/alert-box.png" style="width:100%;height:100%;object-fit:contain;position:absolute;" />
  <div style="position:relative;z-index:1;font-size:24px;font-weight:bold;color:var(--primary);text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center;">New Follower!</div>
</div>
</body>
</html>
